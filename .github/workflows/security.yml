name: Security Scan

# 安全左移门禁：在 PR / push 到 main 时自动执行依赖漏洞、密钥泄露与静态安全扫描。
# 设计原则（见 .workbuddy/security-audit-2026-07-25.md）：
#   - govulncheck + gitleaks 为硬卡点（我方代码已知 0 漏洞、无硬编码密钥，应通过）；
#   - semgrep 初版仅作可见性（continue-on-error），基线评审后可改为 --error 硬卡点。
on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

permissions:
  contents: read
  security-events: write

jobs:
  govulncheck:
    name: Go 依赖漏洞扫描 (govulncheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      - name: 安装并运行 govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  gitleaks:
    name: 密钥泄露扫描 (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'

  semgrep:
    name: 静态应用安全测试 (semgrep, 信息级)
    runs-on: ubuntu-latest
    container:
      image: returntocorp/semgrep
    continue-on-error: true # 初版仅作可见性；基线评审后可移除本行改为硬卡点
    steps:
      - uses: actions/checkout@v4
      - run: semgrep scan --config p/owasp-top-ten --config p/cwe-top-25 --error --json --output semgrep-report.json
