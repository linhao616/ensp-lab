name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install & build frontend
        working-directory: frontend
        run: npm ci && npm run build

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -timeout 120s -parallel 4 ./...

  docker-verify:
    name: Verify Docker build
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t ensp-lab:ci .

      - name: Verify entrypoint
        run: docker run --rm ensp-lab:ci -help

      - name: Smoke test (start + health check)
        run: |
          trap 'docker stop ensp-ci >/dev/null 2>&1 || true' EXIT
          docker run -d --name ensp-ci -p 8080:8080 ensp-lab:ci
          for i in $(seq 1 15); do
            if curl -sf http://localhost:8080/health; then
              echo "Health check passed"
              break
            fi
            echo "Waiting... ($i/15)"
            sleep 2
          done
          curl -sf http://localhost:8080/health || (docker logs ensp-ci && exit 1)
          docker stop ensp-ci
